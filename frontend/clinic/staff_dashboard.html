<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reception | Tap2Med</title>
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/buttons.css" />
    <link rel="stylesheet" href="/assets/css/pages/staff_dashboard.css" />
  </head>
  <body class="extracted-inline-1">
    <header
      class="extracted-inline-2 top-header"
    >
      <div class="brand-header">
        <img
          src="/assets/logo/tap2med_logo.png"
          alt="Tap2Med"
          class="brand-logo"
          onerror="this.style.display = 'none'"
        />
        <span class="brand-text">Tap2Med</span>
        <div class="brand-divider"></div>
        <span class="brand-role">Reception</span>
      </div>
      <div class="extracted-inline-3">
        <a
          href="/staff-directory"
          class="extracted-inline-4 btn btn-secondary btn-sm"
          >Patient Directory</a
        >
        <button
          onclick="showQRCode()"
          class="extracted-inline-5 btn btn-secondary btn-sm"
        >
          Print Clinic QR
        </button>
        <button
          onclick="logout()"
          class="extracted-inline-6 btn btn-ghost btn-sm"
        >
          Log Out
        </button>
      </div>
    </header>

    <main class="queue-grid">
      <div
       class="extracted-inline-7">
        <h3
         class="extracted-inline-8">
          <span class="extracted-inline-9">Phone:</span> Manual Walk-in Check-In
        </h3>

        <div
         class="extracted-inline-10">
          <div class="extracted-inline-11">
            <label
               class="extracted-inline-12">Patient Phone</label
            >
            <input
              type="tel"
              id="walkin-phone"
              class="extracted-inline-13 input"
              placeholder="10-digit number (Optional)"
              maxlength="10"
            />
          </div>
          <div class="extracted-inline-14">
            <label
               class="extracted-inline-15">Patient Name</label
            >
            <input
              type="text"
              id="walkin-name"
              class="extracted-inline-16 input"
              placeholder="Full Name"
              required
            />
          </div>
          <div class="extracted-inline-17">
            <label
               class="extracted-inline-18">City (Optional)</label
            >
            <input
              type="text"
              id="walkin-city"
              class="extracted-inline-19 input"
              placeholder="e.g. New Delhi"
            />
          </div>
          <div class="extracted-inline-20">
            <label
               class="extracted-inline-21">Family Member</label
            >
            <select
              id="manual-member-id"
              class="extracted-inline-22 input"
            >
              <option value="0">Self</option>
              <option value="1">Spouse</option>
              <option value="2">Father</option>
              <option value="3">Mother</option>
              <option value="4">Eldest Child</option>
              <option value="5">Middle Child</option>
              <option value="6">Youngest Child</option>
              <option value="7">Grandfather</option>
              <option value="8">Grandmother</option>
              <option value="9">Other Relative 1</option>
              <option value="10">Other Relative 2</option>
            </select>
          </div>
          <div class="extracted-inline-23">
            <label
               class="extracted-inline-24">Age</label
            >
            <input
              type="number"
              id="walkin-age"
              class="extracted-inline-25 input"
              min="0"
              max="120"
              step="1"
              placeholder="Age"
            />
          </div>
          <div
           class="extracted-inline-26">
            <label
             class="extracted-inline-27">
              <input
                type="checkbox"
                id="walkin-is-appt"
               class="extracted-inline-28"/>
              Is Appt?
            </label>
          </div>
          <div class="extracted-inline-29">
            <button
              onclick="manualCheckIn()"
              class="extracted-inline-30 btn btn-primary"
              id="btn-manual-checkin"
            >
              Generate Token
            </button>
          </div>
        </div>
        <span
          id="manual-status"
         class="extracted-inline-31"></span>
      </div>

      <div
       class="extracted-inline-32">
        <h3
         class="extracted-inline-33">
          Waiting Room
        </h3>
        <span
          class="extracted-inline-34 badge badge-info"
          id="queue-count"
          >Updating...</span
        >
      </div>
      <div id="staff-queue-list" class="extracted-inline-35"></div>

      <div
       class="extracted-inline-36">
        <h3
         class="extracted-inline-37">
          Completed Visits
        </h3>
        <span
          class="extracted-inline-38 badge"
          id="completed-count"
          >0</span
        >
      </div>
      <div id="staff-completed-list"></div>
    </main>

    <!-- QR Code Standee Modal for Staff -->
    <div id="qrModal" class="backdrop">
      <div
       class="extracted-inline-39">
        <h2 class="extracted-inline-40">
          Clinic Check-In QR
        </h2>
        <p
         class="extracted-inline-41">
          Display at reception desk
        </p>
        <div
          id="dashboardQRCode"
         class="extracted-inline-42"></div>
        <button
          onclick="printQRCode()"
          class="extracted-inline-43 btn btn-primary btn-block"
        >
          Print Check-In Poster
        </button>
        <button
          onclick="document.getElementById('qrModal').style.display = 'none'"
          class="extracted-inline-44 btn btn-ghost btn-block"
        >
          Close
        </button>
      </div>
    </div>

    <!-- PRINT LAYOUT 3: Printable QR Code Standee Layout -->
    <div id="print-qr-layout" class="print-only">
      <div
       class="extracted-inline-45">
        <img
          src="/assets/logo/tap2med_logo.png"
          onerror="this.style.display = 'none'"
         class="extracted-inline-46"/>
        <span
           class="extracted-inline-47">Tap2Med</span
        >
      </div>
      <p
       class="extracted-inline-48">
        Clinic Check-In
      </p>
      <h1
       class="extracted-inline-49">
        Scan to Check-In
      </h1>
      <div
        id="print-qr-target"
       class="extracted-inline-50"></div>
      <h2
        id="print-qr-clinic-name"
       class="extracted-inline-51">
        Clinic Name
      </h2>
      <p class="extracted-inline-52">
        Powered by Tap2Med
      </p>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/print_engine.js?v=10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/assets/js/labs.js?v=13"></script>
    <script src="/assets/js/pages/staff_dashboard.js?v=20260914_3"></script>
    <script src="/assets/js/load_layouts.js?v=20260914_3"></script>
  </body>
</html>
