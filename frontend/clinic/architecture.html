<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tap2Med — System Architecture &amp; Patient Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#ffffff;--border:rgba(0,0,0,0.08);
  --text:#0f172a;--muted:#64748b;--panel-w:400px;
  --blue:#2563eb;--indigo:#4f46e5;--amber:#d97706;
  --red:#dc2626;--purple:#7c3aed;--green:#059669;--cyan:#0891b2;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text)}
#root{display:flex;width:100vw;height:100vh}
#panel{width:var(--panel-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);box-shadow:4px 0 24px rgba(0,0,0,0.06);position:relative;z-index:10}
#panel-header{padding:22px 28px 18px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.panel-logo{font-size:.88rem;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.panel-logo span{color:var(--muted);font-weight:500}
.panel-badge{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.18);padding:3px 9px;border-radius:4px}
#step-dots{display:flex;gap:4px;padding:16px 28px 0;flex-shrink:0;flex-wrap:wrap}
.dot{height:3px;border-radius:2px;background:#e2e8f0;transition:background .3s;cursor:pointer;flex:1;min-width:6px;max-width:18px}
.dot.done{background:#bfdbfe}.dot.active{background:var(--blue);box-shadow:0 0 6px rgba(37,99,235,.3)}
#story{flex:1;overflow-y:auto;padding:20px 28px 16px;display:flex;flex-direction:column;gap:14px}
#story::-webkit-scrollbar{width:3px}#story::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.step-meta{display:flex;align-items:center;justify-content:space-between}
.step-counter{font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.step-index{font-size:2.8rem;font-weight:800;color:rgba(37,99,235,.09);line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
#step-title{font-size:1.15rem;font-weight:700;line-height:1.3;letter-spacing:-.3px;color:var(--text)}
#patient-action{display:flex;align-items:flex-start;gap:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:13px 14px}
.pa-avatar{width:34px;height:34px;border-radius:8px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pa-avatar svg{width:16px;height:16px;fill:var(--blue)}
.pa-meta{flex:1;min-width:0}
.pa-name{font-size:.68rem;font-weight:700;color:var(--blue);letter-spacing:.3px;margin-bottom:4px;text-transform:uppercase}
.pa-text{font-size:.82rem;color:var(--muted);line-height:1.55}
#tech-detail{font-size:.78rem;color:var(--muted);line-height:1.75;padding-left:12px;border-left:2px solid #e2e8f0}
#code-wrap{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
#code-wrap.hidden{display:none}
#code-header{background:#f1f5f9;padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e2e8f0}
.code-dot{width:8px;height:8px;border-radius:50%}
#code-lang{font-size:.62rem;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-left:4px}
#code-block{background:#f8fafc;padding:14px 16px;font-family:var(--mono);font-size:.72rem;line-height:1.85;overflow-x:auto;color:#334155}
.c-comment{color:#94a3b8}.c-key{color:#dc2626}.c-fn{color:#7c3aed}.c-str{color:#1d4ed8}.c-val{color:#d97706}.c-result{color:#059669;font-weight:600}.c-del{color:#dc2626;text-decoration:line-through;opacity:.7}
#highlight-box{border-radius:8px;padding:11px 14px;font-size:.78rem;line-height:1.55;font-weight:500;border:1px solid transparent}
#highlight-box.hidden{display:none}
#prog-wrap{padding:0 28px 10px;flex-shrink:0}
#prog-bar-bg{height:2px;background:#e2e8f0;border-radius:1px;overflow:hidden}
#prog-bar-fill{height:100%;border-radius:1px;width:0%;background:linear-gradient(90deg,var(--blue),var(--indigo));transition:width .08s linear}
#nav{display:flex;align-items:center;justify-content:space-between;padding:12px 28px 20px;flex-shrink:0;border-top:1px solid var(--border);gap:10px}
.btn-nav{background:transparent;border:1px solid #e2e8f0;color:var(--muted);padding:8px 16px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--font);transition:border-color .15s,color .15s,background .15s}
.btn-nav:hover:not(:disabled){border-color:#cbd5e1;color:var(--text);background:#f8fafc}.btn-nav:disabled{opacity:.3;cursor:not-allowed}
.btn-auto{flex:1;background:var(--blue);border:none;color:#fff;padding:8px 16px;border-radius:7px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--font);transition:opacity .15s,transform .1s;letter-spacing:.2px;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn-auto:hover{opacity:.88;transform:translateY(-1px)}.btn-auto:active{transform:translateY(0)}
#diagram{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#diagram::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(37,99,235,.13) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
#diagram::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(240,244,248,.65) 100%);pointer-events:none}
#svg-edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2;transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
.node-card{background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:11px;width:122px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);transition:border-color .35s,box-shadow .35s;position:relative}
.node-top-bar{height:2px;width:100%;background:var(--node-color,#2563eb);opacity:.5;transition:opacity .35s}
.node-body{padding:10px 10px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.node-icon-wrap{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--node-color) 10%,white);border:1px solid color-mix(in srgb,var(--node-color) 15%,transparent);flex-shrink:0}
.node-icon-wrap svg{width:16px;height:16px;fill:var(--node-color,#2563eb)}
.node-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1e293b;line-height:1.1}
.node-sub{font-size:.55rem;color:#94a3b8;letter-spacing:.2px}
.node.active .node-card{border-color:color-mix(in srgb,var(--node-color) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--node-color) 10%,transparent),0 8px 24px color-mix(in srgb,var(--node-color) 12%,transparent),0 2px 8px rgba(0,0,0,.06)}
.node.active .node-top-bar{opacity:1}.node.active{transform:translate(-50%,-50%) scale(1.06)}
.node.done .node-card{opacity:.45}.node.done .node-top-bar{opacity:.2}
.e-base{fill:none;stroke-width:1.5;stroke-dasharray:4 10;stroke-linecap:round;opacity:.22}
.e-glow{fill:none;stroke-width:2.2;stroke-dasharray:10 16;stroke-linecap:round;opacity:0;filter:url(#glow)}
.e-glow.flowing{opacity:.75;animation:flow-line .8s linear infinite}
@keyframes flow-line{from{stroke-dashoffset:0}to{stroke-dashoffset:-26}}
.layer-label{position:absolute;left:20px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#cbd5e1;transform:translateY(-50%);z-index:3;pointer-events:none}
</style>
</head>
<body>
<div id="root">
<div id="panel">
  <div id="panel-header">
    <div class="panel-logo">Tap2Med <span>· System Architecture</span></div>
    <div class="panel-badge">Patient Journey</div>
  </div>
  <div id="step-dots"></div>
  <div id="story">
    <div class="step-meta">
      <div class="step-counter" id="step-label">Step 01 of 15</div>
      <div class="step-index" id="step-idx">01</div>
    </div>
    <div id="step-title">—</div>
    <div id="patient-action">

      <div class="pa-meta">

    <div id="tech-detail">—</div>
    <div id="code-wrap" class="hidden">
      <div id="code-header">
        <div class="code-dot" style="background:#ef4444"></div>

        <div class="code-dot" style="background:#10b981"></div>
        <div id="code-lang">Python · Backend</div>
      </div>
      <div id="code-block"></div>
    </div>
    <div id="highlight-box" class="hidden"></div>
  </div>
  <div id="prog-wrap"><div id="prog-bar-bg"><div id="prog-bar-fill"></div></div></div>
  <div id="nav">
    <button class="btn-nav" id="btn-prev" onclick="go(-1)" disabled>← Back</button>
    <button class="btn-auto" id="btn-auto" onclick="toggleAuto()">▶  Auto Play</button>
    <button class="btn-nav" id="btn-next" onclick="go(1)">Next →</button>
  </div>
</div>
<div id="diagram">
  <div class="layer-label" id="ll-1">Entry</div>
  <div class="layer-label" id="ll-2">API</div>
  <div class="layer-label" id="ll-3">Security</div>
  <div class="layer-label" id="ll-4">Storage</div>
  <div class="layer-label" id="ll-5">Clinic Ops</div>
  <div class="layer-label" id="ll-6">Network / Ext</div>
  <svg id="svg-edges">
    <defs>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
</div>
</div>

const diagramEl = document.getElementById('diagram');
const svgEl = document.getElementById('svg-edges');
const nodeEls = {};

function dw(){ return diagramEl.offsetWidth; }
function dh(){ return diagramEl.offsetHeight; }
function px(p,t){ return t*p/100; }

function buildNodes(){
  document.querySelectorAll('.node').forEach(e => e.remove());
  NODES.forEach(n => {
    const div = document.createElement('div');
    div.className = 'node';
    div.id = 'n-' + n.id;
    div.style.setProperty('--node-color', n.color);
    div.style.left = px(n.cx, dw()) + 'px';
    div.style.top  = px(n.cy, dh()) + 'px';
    div.innerHTML = `<div class="node-card"><div class="node-top-bar"></div><div class="node-body"><div class="node-icon-wrap" style="--node-color:${n.color}">${ICONS[n.iconKey]||''}</div><div class="node-title">${n.title}</div><div class="node-sub">${n.sub}</div></div></div>`;
    diagramEl.appendChild(div);
    nodeEls[n.id] = div;
  });
  positionLayerLabels();
}

function positionLayerLabels(){
  const layers = [
    {id:'ll-1', nodeId:'patient'},
    {id:'ll-2', nodeId:'api'},
    {id:'ll-3', nodeId:'hmac'},
    {id:'ll-4', nodeId:'db'},
    {id:'ll-5', nodeId:'staff'},
    {id:'ll-6', nodeId:'underwriter'}
  ];
  const dr = diagramEl.getBoundingClientRect();
  layers.forEach(l => {
    const el = document.getElementById(l.id);
    const n = nodeEls[l.nodeId];
    if(!el || !n) return;
    const nr = n.getBoundingClientRect();
    el.style.top = (nr.top + nr.height/2 - dr.top) + 'px';
  });
}

function nodePort(id, side){
  const el = nodeEls[id];
  if(!el) return {x:0, y:0};
  const dr = diagramEl.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  return {
    x: er.left + er.width/2 - dr.left,
    y: side === 'top' ? er.top - dr.top : er.bottom - dr.top
  };
}

function buildEdges(){
  svgEl.querySelectorAll('.e-base,.e-glow').forEach(e => e.remove());
  EDGES.forEach(edge => {
    const s = nodePort(edge.from, 'bottom');
    const e = nodePort(edge.to, 'top');
    const dy = Math.abs(e.y - s.y);
    const t = Math.min(dy * 0.45, 60);
    const d = `M ${s.x} ${s.y} C ${s.x} ${s.y+t} ${e.x} ${e.y-t} ${e.x} ${e.y}`;
    
    const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    base.setAttribute('d', d);
    base.setAttribute('class', 'e-base');
    base.setAttribute('stroke', edge.color);
    base.id = 'base-' + edge.id;
    svgEl.appendChild(base);
    
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    glow.setAttribute('d', d);
    glow.setAttribute('class', 'e-glow');
    glow.setAttribute('stroke', edge.color);
    glow.id = 'glow-' + edge.id;
    svgEl.appendChild(glow);
  });
}

let currentStep = 0, autoTimer = null, progTimer = null, progPct = 0;
const AUTO_DUR = 5500;

function renderStep(idx){
  const step = STEPS[idx];
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', i < idx);
  });
  const n = String(idx+1).padStart(2, '0');
  document.getElementById('step-label').textContent = `Step ${n} of ${STEPS.length}`;
  document.getElementById('step-idx').textContent = n;
  document.getElementById('step-title').textContent = step.title;
  document.getElementById('pa-text').textContent = step.pa;
  document.getElementById('tech-detail').textContent = step.tech;
  
  const cw = document.getElementById('code-wrap');
  const cb = document.getElementById('code-block');
  const cl = document.getElementById('code-lang');
  if(step.code){
    cb.innerHTML = step.code;
    cl.textContent = step.codeFile || 'Python · Backend';
    cw.classList.remove('hidden');
  } else {
    cw.classList.add('hidden');
  }
  
  const hb = document.getElementById('highlight-box');
  if(step.highlight){
    hb.style.background = step.highlight.color + '12';
    hb.style.borderColor = step.highlight.color + '40';
    hb.style.color = step.highlight.color;
    hb.textContent = step.highlight.text;
    hb.classList.remove('hidden');
  } else {
    hb.classList.add('hidden');
  }
  
  NODES.forEach(n => {
    const el = nodeEls[n.id];
    if(!el) return;
    el.classList.remove('active', 'done');
    if(step.nodes.includes(n.id)) {
      el.classList.add('active');
    } else if(STEPS.slice(0, idx).some(s => s.nodes.includes(n.id))) {
      el.classList.add('done');
    }
  });
  
  EDGES.forEach(edge => {
    const g = document.getElementById('glow-' + edge.id);
    const b = document.getElementById('base-' + edge.id);
    const on = step.edges.includes(edge.id);
    if(g) g.classList.toggle('flowing', on);
    if(b) b.style.opacity = on ? '0.35' : '0.22';
  });
  
  document.getElementById('btn-prev').disabled = (idx === 0);
  document.getElementById('btn-next').disabled = (idx === STEPS.length - 1);
}

function go(dir){
  const next = currentStep + dir;
  if(next < 0 || next >= STEPS.length) return;
  currentStep = next;
  renderStep(currentStep);
  if(autoTimer) resetProgress();
}

function startProgress(){
  progPct = 0;
  clearInterval(progTimer);
  const step = 60;
  progTimer = setInterval(() => {
    progPct += (step / AUTO_DUR) * 100;
    document.getElementById('prog-bar-fill').style.width = Math.min(progPct, 100) + '%';
    if(progPct >= 100){
      clearInterval(progTimer);
      if(currentStep < STEPS.length - 1){
        go(1);
        startProgress();
      } else {
        stopAuto();
      }
    }
  }, step);
}

function resetProgress(){
  progPct = 0;
  document.getElementById('prog-bar-fill').style.width = '0%';
  clearInterval(progTimer);
  if(autoTimer) startProgress();
}

function startAuto(){
  autoTimer = true;
  document.getElementById('btn-auto').textContent = '⏸  Pause';
  document.getElementById('btn-auto').style.background = '#64748b';
  startProgress();
}

function stopAuto(){
  autoTimer = null;
  clearInterval(progTimer);
  document.getElementById('btn-auto').textContent = '▶  Auto Play';
  document.getElementById('btn-auto').style.background = 'var(--blue)';
  document.getElementById('prog-bar-fill').style.width = '0%';
}

function toggleAuto(){
  if(autoTimer) stopAuto();
  else startAuto();
}

function buildDots(){
  const c = document.getElementById('step-dots');
  c.innerHTML = '';
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = `Step ${i+1}`;
    d.onclick = () => {
      currentStep = i;
      renderStep(i);
      if(autoTimer) resetProgress();
    };
    c.appendChild(d);
  });
}

window.addEventListener('resize', () => {
  NODES.forEach(n => {
    const el = nodeEls[n.id];
    if(el){
      el.style.left = px(n.cx, dw()) + 'px';
      el.style.top  = px(n.cy, dh()) + 'px';
    }
  });
  requestAnimationFrame(() => {
    buildEdges();
    positionLayerLabels();
  });
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' '){
    e.preventDefault();
    go(1);
  }
  if(e.key === 'ArrowLeft'){
    e.preventDefault();
    go(-1);
  }
});

function init(){
  buildNodes();
  requestAnimationFrame(() => {
    buildEdges();
    buildDots();
    renderStep(0);
  });
}

init();
</script>
